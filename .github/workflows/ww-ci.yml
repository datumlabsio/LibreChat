# WW fork CI (ADR-16): build the frozen-fork image, scan it, stage it in GHCR.
# Deploys mirror GHCR → registry.trydatumlabs.com via `skopeo copy` from a machine
# with registry access, so the scanned image is byte-identical to what ships.
# The weekly cron re-scans the latest staged image — CVE awareness that works even
# if every release-announcement channel fails (frozen-fork policy, plan §7).
name: ww-ci
on:
  push:
    branches: [ww/patches]
  schedule:
    - cron: "17 6 * * 1" # weekly rescan, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/datumlabsio/librechat-ww

jobs:
  build-scan-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ww/patches

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (only on push/dispatch — cron rescans the staged image)
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail CRITICAL, warn HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy HIGH report (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true
