# WW fork CI (ADR-16, hardened by ADR-25): build the frozen-fork image, PROVE the
# client bundle is really in it, scan it, and only then move the :latest pointer.
#
# Why the assertion exists (ADR-26): upstream's Dockerfile chained
# `npm run frontend; npm prune …` with a SEMICOLON, so a failed client build was
# swallowed — CI reported SUCCESS while staging images with no client bundle.
# The Dockerfile now uses `&&` (ww-fix), and this workflow additionally refuses to
# publish anything that cannot be shown to contain the built client + our patches.
#
# Deploys mirror GHCR → registry.trydatumlabs.com with `skopeo copy` by DIGEST from a
# run whose assertion passed (ADR-27). Never mirror a floating tag.
name: ww-ci
on:
  push:
    branches: [ww/patches]
  schedule:
    - cron: "17 6 * * 1" # weekly rescan + re-assert of the published image
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/datumlabsio/librechat-ww
  # Literals that must survive minification into the client bundle (ADR-25).
  MARKER_CHIP: ww-route-chip
  MARKER_ECHARTS: ww-echarts-block

jobs:
  build-scan-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ww/patches

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build pushes the immutable :sha tag ONLY. :latest is moved later, after the
      # assertion and the CRITICAL scan both pass, so :latest can never point at an
      # unasserted image (ADR-25).
      - name: Build image (sha tag only)
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image under test
        id: img
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"   # cron re-asserts what is published
          else
            echo "ref=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # ── The gate. Runs on push AND on the weekly cron (pull-and-inspect, seconds):
      # the cron path is what would have caught a stale/bundle-less :latest.
      - name: Assert client bundle
        run: |
          set -euo pipefail
          REF='${{ steps.img.outputs.ref }}'
          echo "Asserting client bundle in ${REF}"
          docker pull -q "$REF"
          docker create --name ww-assert "$REF" >/dev/null
          rm -rf /tmp/dist && mkdir -p /tmp/dist
          docker cp ww-assert:/app/client/dist /tmp/dist/ >/dev/null
          docker rm ww-assert >/dev/null
          D=/tmp/dist/dist

          test -s "$D/index.html" || { echo "::error::client dist/index.html missing or empty"; exit 1; }
          COUNT=$(find "$D/assets" -type f -name '*.js' | wc -l)
          [ "$COUNT" -ge 5 ] || { echo "::error::only $COUNT js assets — client build looks truncated"; exit 1; }
          BYTES=$(du -sb "$D/assets" | cut -f1)
          [ "$BYTES" -ge 1000000 ] || { echo "::error::assets total ${BYTES}B — implausibly small"; exit 1; }
          # rolldown/vite emit `assets/index.<hash>.js` (dot separator); older vite used
          # `index-<hash>.js`. Accept either so the assertion tracks the bundler, not a guess.
          grep -qE 'assets/index[.-][A-Za-z0-9_-]{6,}\.js' "$D/index.html" \
            || { echo "::error::index.html references no hashed entry bundle"; \
                 grep -oE '(src|href)="[^"]*\.js"' "$D/index.html" | head -5; exit 1; }

          # Our patches must be present in the shipped bundle, not just in git.
          grep -rqF "$MARKER_CHIP" "$D/assets" \
            || { echo "::error::fork-02 marker $MARKER_CHIP absent from bundle"; exit 1; }
          grep -rqF "$MARKER_ECHARTS" "$D/assets" \
            || { echo "::error::fork-01 marker $MARKER_ECHARTS absent from bundle"; exit 1; }

          echo "✅ client bundle asserted: $COUNT js assets, ${BYTES}B, both fork markers present"

      # ── Second gate: does the app actually START? The bundle assertion above proves
      # files EXIST; it cannot prove the server boots. On 2026-07-30 an image passed the
      # bundle assertion and still crashed on launch (`Cannot find module
      # '@langchain/core/errors'` — a lockfile hoisting regression from a security
      # override). Two "green CI" illusions in one day, both from checking artifacts
      # instead of behavior. This step closes that class.
      - name: Assert server boots
        run: |
          set -euo pipefail
          REF='${{ steps.img.outputs.ref }}'
          docker network create ww-boot >/dev/null
          docker run -d --name ww-boot-mongo --network ww-boot mongo:7 --noauth >/dev/null
          docker run -d --name ww-boot-app --network ww-boot -p 3080:3080 \
            -e HOST=0.0.0.0 -e PORT=3080 \
            -e MONGO_URI=mongodb://ww-boot-mongo:27017/LibreChat \
            -e JWT_SECRET=cibootsecret -e JWT_REFRESH_SECRET=cibootrefresh \
            -e CREDS_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e CREDS_IV=0123456789abcdef0123456789abcdef \
            -e ALLOW_EMAIL_LOGIN=true -e NO_INDEX=true -e SEARCH=false \
            "$REF" >/dev/null

          ok=0
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3080/api/config; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ww-boot-app)" != "true" ]; then
              echo "::error::container exited during boot — logs follow"; break
            fi
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "----- container logs -----"
            docker logs ww-boot-app 2>&1 | tail -40
            docker rm -f ww-boot-app ww-boot-mongo >/dev/null 2>&1 || true
            docker network rm ww-boot >/dev/null 2>&1 || true
            echo "::error::server did not serve /api/config — image is NOT deployable"
            exit 1
          fi

          # Still running after serving? (catches boot-then-crash.)
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' ww-boot-app)" = "true" ] \
            || { docker logs ww-boot-app 2>&1 | tail -40; echo "::error::server exited after first response"; exit 1; }

          echo "✅ server boots and serves /api/config"
          docker rm -f ww-boot-app ww-boot-mongo >/dev/null
          docker network rm ww-boot >/dev/null

      # Governance invariant (ADR-33, widened per the B-4 finding 2026-07-30): checking
      # `sharedLinks.public: false` in librechat.yaml is NOT sufficient — anonymous share
      # reads are gated by a SEPARATE env var (ALLOW_SHARED_LINKS_PUBLIC), so a Deployment
      # env or .env line alone re-opens them. Assert both layers.
      - name: Assert share-link invariants
        run: |
          set -euo pipefail
          if git grep -nE '^[^#]*ALLOW_SHARED_LINKS_PUBLIC\s*[=:]\s*(true|"true"|1)' -- . ; then
            echo "::error::ALLOW_SHARED_LINKS_PUBLIC is enabled somewhere — anonymous share reads would be open"
            exit 1
          fi
          echo "✅ no truthy ALLOW_SHARED_LINKS_PUBLIC (anonymous share reads stay closed)"

      - name: Trivy scan (fail CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy HIGH report (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true

      # Only now is the image deployable. The cron never retags (ADR-25).
      - name: Promote to :latest (asserted + scanned)
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest"
          docker push -q "${IMAGE}:latest"
          echo "Deployable digest for skopeo mirror (ADR-27):"
          docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${{ github.sha }}"
